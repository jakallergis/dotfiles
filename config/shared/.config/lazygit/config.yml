# ~/.config/lazygit/config.yml — symlinked from dotfiles/config/shared/.config/lazygit/
#
# The delta only. Everything not named here stays lazygit's default, which is
# how upstream improvements arrive without being asked for.
#
# THE TRAP: on macOS lazygit does not read this file unless XDG_CONFIG_HOME is
# set. With the variable unset it looks in ~/Library/Application Support/lazygit/
# and this file is ignored in silence — config that works on Linux and does
# nothing on the Mac, with no error to explain it. config/shared/.zshrc exports
# XDG_CONFIG_HOME for precisely this. Confirm with `lazygit --print-config-dir`.

git:
  # Diffs inside lazygit look like diffs everywhere else, because both go
  # through delta — the same delta ~/.gitconfig sets as core.pager.
  #
  # `stdinFilter` is the renderer type for a pager fed a diff on stdin, and
  # colorArg makes lazygit pass --color=always so delta receives colour to
  # restyle. `git.paging.pager` was the old spelling of this and was removed in
  # lazygit 0.64 — a config using it is accepted and silently does nothing.
  #
  # The flags belong in `command`, not in a sibling `args:` list: lazygit
  # rejects `args` for a stdinFilter outright, and its way of telling you is
  # to refuse to start with a one-line message and exit 0.
  diffRenderers:
    - type: stdinFilter
      name: delta
      colorArg: always
      command: delta --paging=never

  # Commits panel: include commits from every branch, not only the ancestry of
  # the one checked out. Without this, a branch you are not on is simply absent
  # from the graph — which is what makes it unreadable, because there is nothing
  # to branch *from*. Equivalent to `git log --all`; Ctrl-l toggles it live.
  log:
    showWholeGraph: true

  # The Status panel's `a` view (all-branches log graph). lazygit's default
  # passes --pretty=medium, which spends five lines per commit and pushes the
  # graph itself off the screen; one line each is what makes a graph readable.
  #
  # `a` cycles through this list, so the verbose default is kept as the second
  # entry rather than thrown away — press it twice for the full-detail version.
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=format:'%C(auto)%h%d %s %C(cyan)%an%C(reset) %C(green)%ar'
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=medium

update:
  # mise owns this binary and pins it in the tracked mise config.toml, so a
  # self-update prompt could only ever produce drift between the two.
  method: never

# The "Thanks for using lazygit" panel that greets every fresh config.
disableStartupPopups: true

gui:
  # File-type and branch icons. Needs a Nerd Font in the terminal, which
  # steps/shared/30-fonts.sh installs (MesloLGS NF, patched to Nerd Fonts v3).
  # Set your terminal's font to it or every icon here renders as a tofu box.
  nerdFontsVersion: "3"
