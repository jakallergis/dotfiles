# ~/.config/tmux/tmux.conf — symlinked from dotfiles/config/shared/.config/tmux/
#
# tmux keeps a shell alive on the machine it runs on, not in your terminal.
# Shut the laptop, lose the wifi, ssh back in tomorrow: the session is still
# there, still running whatever you left it doing. That is the reason this file
# exists. Everything else in it is about making tmux pleasant enough to stay in.
#
# The prefix is the stock Ctrl-b, so anything you read elsewhere applies. After
# editing this file, reload with Ctrl-b r.
#
# This path needs tmux >= 3.1; older versions only look at ~/.tmux.conf and
# would start silently unconfigured. mise pins 3.7, so it is a given here —
# `tmux -V` if you are ever on a machine that got tmux some other way.

# --- 1. terminal ------------------------------------------------------------
# The one thing on this machine that tmux cannot bring with it: TERM has to name
# a terminfo entry the *system* has. tmux-256color is missing from slim
# container images and from older macOS, and tmux then refuses to start at all
# with "missing or unsuitable terminal" — on a remote box, with no shell to fix
# it from. So: ask, and fall back to the entry that has existed forever.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Capabilities of the *outer* terminal, which terminfo understates. RGB gives
# 24-bit colour (p10k, bat, delta); usstyle gives coloured undercurls.
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:usstyle'

# Let a program inside a pane talk to the outer terminal directly. Needed by
# anything using OSC escapes tmux does not itself understand — inline images,
# and some TUIs' cursor and clipboard tricks.
set -g allow-passthrough on

# --- 2. clipboard -----------------------------------------------------------
# The remote-work one. With set-clipboard on, tmux copies via OSC 52, an escape
# sequence that asks *your* terminal to put the text on *your* clipboard. So a
# yank inside tmux on a Coder box lands in the macOS clipboard, with no X11
# forwarding and no ssh tunnel.
#
# iTerm2 needs this allowed once: Settings -> General -> Selection ->
# "Applications in terminal may access clipboard". WezTerm and Ghostty support
# it, one of them behind a prompt; Terminal.app does not support it at all,
# which is what @copy below is the belt-and-braces for.
set -s set-clipboard on

# @copy — where a copied selection also gets piped, when the machine has
# somewhere local to put it. `cat` is the do-nothing default: the tmux buffer
# and OSC 52 have already done the work. Ordered so the last match wins, and
# wl-copy beats xclip because a Wayland session often has both.
set -g @copy 'cat'
if-shell 'command -v xclip  >/dev/null 2>&1' 'set -g @copy "xclip -selection clipboard -in"'
if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -g @copy "wl-copy"'
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -g @copy "pbcopy"'

# --- 3. behaviour -----------------------------------------------------------
set -g mouse on                 # scroll, click a pane, drag a border. Ctrl-b M toggles it
set -g history-limit 100000     # an agent can fill 2000 lines before you look away
set -sg escape-time 10          # or vim eats the Esc key for 500ms
set -g focus-events on          # so editors notice they lost focus
set -g display-time 2000
set -g status-interval 5

set -g base-index 1             # windows and panes start at 1: it is the key
setw -g pane-base-index 1       # your left hand is already on
set -g renumber-windows on      # close window 2 of 3 and the third becomes 2

# Sessions outlive their clients — this is the whole feature, so it is spelled
# out rather than left to the default.
set -g destroy-unattached off
# Killing a session drops you into another one instead of back to bare ssh.
set -g detach-on-destroy off
# Two clients on one session: size each *window* to the client looking at it,
# not to the smallest client anywhere. Without this, one forgotten phone-sized
# client squeezes the laptop.
setw -g aggressive-resize on

set -g set-titles on
set -g set-titles-string '#S:#I #W · #h'

# Alerts show as a flag in the status line, never as a message that steals the
# screen while you are typing.
setw -g monitor-bell on
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

# --- 4. keys, with the prefix ----------------------------------------------------
set -g status-keys emacs        # the Ctrl-b : command line, where zsh habits apply
setw -g mode-keys vi            # copy mode, where vim habits apply

bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf reloaded'

# Splits and new windows inherit the current directory. tmux's own defaults
# start you in $HOME, which is almost never what you meant.
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# -r means repeatable: hold the prefix once, then tap the key.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind Tab last-window            # `l` used to be this, and hjkl wanted it

bind m set -g mouse \; display 'mouse #{?mouse,on,off}'

# Ctrl-b S — flag this window in the status line once it has been quiet for
# 30 seconds. The "tell me when the agent stops typing" key.
bind S if -F '#{monitor-silence}' \
  { setw monitor-silence 0  ; display 'silence alert off' } \
  { setw monitor-silence 30 ; display 'will flag this window after 30s of quiet' }

# Copy mode: v to select, y to copy, Ctrl-b ] to paste. Mouse drag copies too,
# and keeps the selection on screen instead of blanking it.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel '#{@copy}'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear '#{@copy}'

# --- 5. keys without the prefix ---------------------------------------------
# The handful that have to be as fast as iTerm2's own. `bind -n` puts a key in
# the root table, which means no prefix — and also means it is taken away from
# every program running inside tmux, forever. So each one below was checked
# against a live `bindkey` first, and what it shadows is in the comment.
#
# They need the terminal to actually send Meta, which macOS does not do by
# default: iTerm2 -> Settings -> Profiles -> Keys -> Left Option Key: `Esc+`,
# leaving Right Option on `Normal` so it still types é and —. That setting is
# iTerm2's own preference file, so it is not tracked here. On Linux, Alt already
# works. Where Meta is not configured every key below has a prefixed twin in
# section 4, so nothing becomes unreachable; it just costs a Ctrl-b.

# Splits, mirroring iTerm2's Cmd-d / Shift-Cmd-d one modifier along. tmux can
# never see Cmd — macOS terminals do not transmit it — so Option is as close as
# this gets. Capital D works because Shift-Option-d sends Esc then `D`.
bind -n M-d split-window -h -c '#{pane_current_path}'   # pane to the right (was zsh kill-word)
bind -n M-D split-window -v -c '#{pane_current_path}'   # pane below        (was zsh kill-word)

# Pane navigation, one modifier off the Cmd-Option-arrow habit. Free here: this
# zsh puts word movement on Ctrl-arrows and M-b/M-f and leaves Option-arrows
# undefined, so nothing is lost.
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

bind -n M-z resize-pane -Z     # zoom toggle    (was execute-last-named-cmd)
bind -n M-s choose-tree -Zs    # session picker (was spell-word)

# Option-Space was the ask; it is Alfred's hotkey. Shift-Option-Space cannot
# substitute, because a terminal sends the same byte for Space and Shift-Space —
# tmux receives plain M-Space either way. (`cat -v`, then press both, proves it
# in five seconds.) Telling them apart needs CSI-u extended keys enabled in both
# iTerm2 and tmux, which changes how every key is reported and upsets other
# TUIs. So `=`, for "make the panes equal", which zsh leaves undefined.
bind -n M-= next-layout

# --- 6. status line ---------------------------------------------------------
# Understated on purpose: p10k already draws a busy prompt directly above it.
# bg=default keeps the terminal's own background, so it suits light and dark.
#
# Left is the session name — the thing you need when `t ls` shows four of them.
# Right is the hostname, which is what stops you running a command on the wrong
# machine, plus a PREFIX flag so a half-pressed Ctrl-b is visible.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default fg=colour245'

set -g status-left-length 30
set -g status-left '#[fg=colour39,bold]#S#[default] '

set -g status-right-length 70
set -g status-right '#{?client_prefix,#[fg=colour214]PREFIX ,}#{?session_many_attached,#[fg=colour214]shared ,}#[fg=colour245]#h  #[fg=colour244]%a %d %b %H:%M '

set -g window-status-separator ''
set -g window-status-format         '#[fg=colour244] #I:#W#F '
set -g window-status-current-format '#[fg=colour39,bold] #I:#W#F '
set -g window-status-activity-style 'fg=colour214'
set -g window-status-bell-style     'fg=colour203,bold'

set -g pane-border-style        'fg=colour238'
set -g pane-active-border-style 'fg=colour39'
set -g display-panes-colour        colour238
set -g display-panes-active-colour colour39

set -g message-style 'bg=colour39 fg=colour232'
set -g mode-style    'bg=colour39 fg=colour232'
